name: 更新B站数据

on:
  push:
    paths-ignore:
      - 'snapshots.csv'
      - 'data.json'
      - 'report.csv'
      - 'report.md'
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: windows-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 抓取B站数据
        shell: powershell
        run: .\track.ps1

      - name: 提交并推送
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无数据变化"
          else
            git commit -m "chore: update bilibili data"
            git push
          fi
